name: CI

on:
  push:
    branches: [main, "sprint-*", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Orvian.slnx

      - name: Build
        run: dotnet build Orvian.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Orvian.slnx --configuration Release --no-build
